name: test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    sandbox = false
    keep-build-log = false
  XDG_RUNTIME_DIR: /tmp/forgejo-runtime

jobs:
  test:
    runs-on: [k8s-executor-medium, amd64]
    timeout-minutes: 20
    steps:
      - uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run checks with locked Nix tools
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$XDG_RUNTIME_DIR"
          biome_package=$(nix build .#biome-ci --no-link --print-out-paths)
          export BIOME_BINARY="$biome_package/bin/biome"
          cat "$biome_package/nix-support/elf-runtime"
          "$BIOME_BINARY" --version
          nix shell --inputs-from . nixpkgs#nodejs_22 nixpkgs#pnpm_10 --command bash -euo pipefail -c '
            pnpm install --frozen-lockfile
            pnpm run verify
          '
